<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1: Todo App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        #app {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
        }

        #input-area {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        #todo-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        #add-btn {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        #add-btn:hover {
            background: #45a049;
        }

        #todo-list {
            list-style: none;
            padding: 0;
        }

        #todo-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        #todo-list li:hover {
            background: #f5f5f5;
        }

        #todo-list li.done span {
            text-decoration: line-through;
            color: #999;
        }

        .delete-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            background: #da190b;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>My Todo List</h1>
        <div id="input-area">
            <input type="text" id="todo-input" placeholder="Add a task..." />
            <button id="add-btn">Add</button>
        </div>
        <ul id="todo-list"></ul>
    </div>

    <script src="task1-todo-app.js"></script>
    <script>
        TodoApp.init();
    </script>
</body>
</html>
