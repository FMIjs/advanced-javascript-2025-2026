<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2: API Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        #app {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
        }

        #controls {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        #controls button {
            padding: 10px 20px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        #controls button:hover {
            background: #0b7dda;
        }

        #controls button.active {
            background: #4CAF50;
        }

        #loading {
            padding: 20px;
            text-align: center;
            color: #666;
            font-style: italic;
        }

        #error {
            padding: 20px;
            background: #ffebee;
            color: #c62828;
            border-radius: 4px;
            margin: 10px 0;
        }

        #data-list {
            list-style: none;
            padding: 0;
            margin: 20px 0;
        }

        #data-list li {
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 4px;
            margin-bottom: 10px;
            background: #fafafa;
        }

        #data-list h3 {
            margin: 0 0 10px 0;
            color: #333;
        }

        #data-list p {
            margin: 5px 0;
            color: #666;
            font-size: 14px;
        }

        #data-list li.completed {
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>API Dashboard</h1>
        <div id="controls">
            <button data-endpoint="posts">Posts</button>
            <button data-endpoint="users">Users</button>
            <button data-endpoint="todos">Todos</button>
        </div>
        <div id="loading" style="display: none;">Loading...</div>
        <div id="error" style="display: none;"></div>
        <ul id="data-list"></ul>
    </div>

    <script src="task2-api-dashboard.js"></script>
    <script>
        Dashboard.init();
    </script>
</body>
</html>
