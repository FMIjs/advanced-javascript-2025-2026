<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3: Lazy Loading Image Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        #app {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }

        .gallery-item {
            aspect-ratio: 1;
            overflow: hidden;
            border-radius: 8px;
            background: #f0f0f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: scale(1.02);
        }

        .gallery-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #loading {
            display: none;
            text-align: center;
            padding: 40px 20px;
            color: #666;
            font-style: italic;
        }

        #scroll-sentinel {
            height: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>Image Gallery</h1>
        <div id="gallery"></div>
        <p id="loading">Loading more images...</p>
    </div>

    <script src="task3-lazy-loading.js"></script>
    <script>
        ImageGallery.init();
    </script>
</body>
</html>
